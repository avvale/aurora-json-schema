# yaml-language-server: $schema=../../schemas/json/aurora-2.0.json
# This fixture exercises the DEPRECATED `readonly` spelling on purpose, to prove
# the schema still accepts it during the compatibility window (removed in
# core-back@3.0.0 and the next CLI major). New modules should use `readOnly`.
version: 0.0.1
boundedContextName: library
moduleName: book
moduleNames: books
aggregateName: LibraryBook
hasOAuth: true
hasTenant: false
hasAuditing: false
aggregateProperties:
  - name: id
    type: id
    primaryKey: true
    nullable: false
  - name: rowId
    type: bigint
    index: unique
    autoIncrement: true
    nullable: false
  - name: viewsCount
    type: bigint
    nullable: false
    readonly: true
  - name: createdAt
    type: timestamp
    nullable: true
  - name: updatedAt
    type: timestamp
    nullable: true
  - name: deletedAt
    type: timestamp
    nullable: true
